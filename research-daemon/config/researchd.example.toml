# Tavily is the first provider. The key itself is never stored here.
[provider.tavily]
api_key_env = "TAVILY_API_KEY"
base_url = "https://api.tavily.com"
requests_per_minute = 60
burst = 10
max_concurrency = 4
max_retries = 4
timeout_seconds = 60
cache_ttl_seconds = 21600
# Optional explicit manifest for direct binaries. When omitted, SecretSpec
# searches upward from the working directory and honours SECRETSPEC_FILE.
# secretspec_file = "/path/to/research-station/secretspec.toml"

# Reddit is optional. Without a key the daemon keeps using Tavily and records
# a warning; it does not fail startup.
[provider.reddit]
mode = "auto"                 # auto | always | never
backend = "redditapis"        # only redditapis is implemented
base_url = "https://api.redditapis.com"
api_key_env = "REDDIT_API_KEY"
# Redditapis allows about 20 burst reads, then about 10 reads/s.
requests_per_minute = 600
burst = 20
max_concurrency = 2
max_retries = 3
timeout_seconds = 30
cache_ttl_seconds = 3600
max_results = 25
include_comments = true
comment_limit = 20
# Fetch comments for this many leading search results.
comment_thread_limit = 3
# Cap on pre-seeded plus model-chosen Reddit searches per job.
max_searches_per_job = 4
# Optional explicit manifest. Falls back to provider.tavily.secretspec_file and
# then SECRETSPEC_FILE.
# secretspec_file = "/path/to/research-station/secretspec.toml"

# OpenAI-compatible model provider. The key itself is never stored here.
[llm]
provider = "opencode-go"
base_url = "https://opencode.ai/inference/go/openai/v1"
model = "deepseek-v4.1-flash"
api_key_env = "OPENCODE_GO_API_KEY"
fallback_api_key_envs = ["OPENCODE_API_KEY"]
# Stable routing/caching identity sent as x-opencode-session. Omit to generate
# one per provider instance; the agent will use the job ID.
# session_id = "my-research-station"
# Optional explicit manifest. Falls back to provider.tavily.secretspec_file and
# then SECRETSPEC_FILE.
# secretspec_file = "/path/to/research-station/secretspec.toml"
timeout_seconds = 120
max_retries = 3
temperature = 0.2
max_output_tokens = 4096

[store]
# Jobs, plans, evidence indexes, usage, and cache metadata share one database.
# Omit to use $XDG_CACHE_HOME/research-station/cache.sqlite.
# database_path = "/var/cache/research-station/researchd.sqlite"
# cache_path is the older name for the same file; database_path wins if both
# are set.
# cache_path = "/var/cache/research-station/cache.sqlite"
# blob_dir = "/var/cache/research-station/blobs"

[jobs]
# How long a worker owns a claimed job before another worker may reap it.
lease_seconds = 60
# Global cap on jobs executing at once.
max_concurrent_jobs = 1
# How often the service looks for expired leases.
reap_interval_seconds = 30
# How long an idle worker waits before polling the queue again.
poll_interval_seconds = 2

[budget]
max_queries = 100
max_credits = 1000
