[project]
name = "research-station"
revision = "1.0"

# Credentials for live provider calls. Values come from whichever provider the
# developer configured (system keyring locally, workflow environment in CI);
# nothing secret belongs in this file.
#
# Every Tavily call is billed. Reddit is optional: Redditapis includes 1,000
# free reads per month, then $1.50 per 1,000 reads. Provider unit tests use
# Wiremock by default; `research provider test` and `research provider
# reddit-test` are the smoke tests that need a real key.
[profiles.default]
TAVILY_API_KEY = { description = "Tavily API key from https://app.tavily.com/home", required = true }
TAVILY_TEST_QUERY = { description = "Query used by `research provider test` (default: Tavily API connectivity test)", required = false }
REDDIT_API_KEY = { description = "Redditapis.com API key (optional; enables Reddit search)", required = false }
OPENCODE_GO_API_KEY = { description = "OpenCode Go API key used by the daemon's model client (optional for fake-LLM tests)", required = false }
